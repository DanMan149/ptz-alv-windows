<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alveus PTZ</title>
<link rel="icon" type="image/x-icon" href="./img/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="vendor/introjs.min.css">
<link rel="stylesheet" type="text/css" href="styles.css?v=2">
<link rel="stylesheet" type="text/css" href="extra.css?v=8">
</head>
<body>
    <div class="background-overlay"></div> <!-- Blurred background image overlay -->
    <!-- Main container for direction-pad and preset-pad -->
    <div class="container">
        <div class="left-menu" >
      
            <div class="heading-container">
                <div class="logo">
                    <img src="/img/logo.webp" alt="Logo">
                </div>
        
                <h1 class="ptz-heading">
                    
                    <a href="admin.html">
                        <img src="/img/settings.png" alt="Admin Settings" class="admin-icon">
                    </a>
        <!-- Info Icon -->
        <span class="fas fa-info-circle custom-info-icon" title=""></span>
                </h1>
                <span class="layout-icons">
                    <span id="gridIcon" class="grid-icon active-icon"></span>
                    <span id="vidIcon" class="vid-icon active-icon"></span>
                </span>
            </div>
      
      
            <div class="direction-and-ptz-container">
                <!-- Container for cameras list -->
                <div class="direction-container">
                    <h2 class="direction-heading-camera" id="cameraheading">
                        <span id="cameraLabel">- Cameras -</span>
                    </h2>
                    <input type="search" id="cameraSearch" class="cam-search-input" placeholder="Search..." aria-label="Filter cameras" autocomplete="off">
                    <div class="camera-container" id="cameraContainer" style="height: 271px;"></div>
                    <div class="resize-handle" data-target="cameraContainer"></div>
                </div>

                <!-- Direction buttons -->
                <div class="direction-container" id="directionpadContainer">
                    <h2 class="direction-heading" style="position: relative; text-align: center;">
			<span style="display: inline-block; cursor: pointer;" onclick="toggleDirectionPad(&#39;.direction-pad-outer&#39;)">- Control -</span>
			<span class="info-icon" style="position: absolute; right: 10px; cursor: pointer;" id="infoIcon">
			    <i class="fas fa-info-circle"></i> <!-- Font Awesome icon -->
			</span>
                    </h2>
                    <div class="direction-pad-outer">
                        <div class="pad-heading-container">
                            <h2 class="direction-zoom-heading" id="ZoomPadHeading" style="cursor: pointer;" onclick="togglePad(&#39;.zoom-pad&#39;); setActiveHeading(&#39;.direction-zoom-heading&#39;);">Zoom
                            </h2>
                            <h2 class="direction-focus-heading active" id="focusPadHeading" style="cursor: pointer;" onclick="togglePad(&#39;.focus-pad&#39;); setActiveHeading(&#39;.direction-focus-heading&#39;);">Focus
                            </h2>

                            <h2 class="direction-move-heading" id="movePadHeading" style="cursor: pointer; display: none;" onclick="togglePad(&#39;.direction-pad&#39;); setActiveHeading(&#39;.direction-move-heading&#39;);">Move
                            </h2>
                        </div>
                        <div class="direction-container-inner">
                            <div class="zoom-pad hidden">
                                <button class="arrow-button"></button>
                                <button class="ptz-arrow-button" id="zoomplus" onclick="sendpadZoom(&#39;plus&#39;)" onmousedown="animateButton(this)">+</button>
                                <button class="arrow-button"></button>
                                <button class="ptz-arrow-button" id="zoomleft" onclick="decrementZoom()" onmousedown="animateButton(this)">◀</button>
                                <button class="ptz-arrow-button" id="sliderZoomLabel" style="font-size: 17px;" onclick="selectZoom()">30%</button>
                                <button class="ptz-arrow-button" id="zoomright" onclick="incrementZoom()" onmousedown="animateButton(this)">▶</button>
                                <button class="arrow-button"></button>
                                <button class="ptz-arrow-button" id="zoomminus" onclick="sendpadZoom(&#39;minus&#39;)" onmousedown="animateButton(this)">-</button>
                                 <button class="arrow-button"></button>
                             </div>

                            <div class="focus-pad">
                                <button class="cf-button" id="enablecf" onclick="enableCF(this)">CF</button>
                                <button class="ptz-arrow-button" id="focusplus" onclick="sendpadFocus(&#39;plus&#39;)" onmousedown="animateButton(this)">+</button>
                                <button class="nfc-button" id="enablenfc" onclick="enableNFC(this)">NFC</button>
                                <button class="ptz-arrow-button" onclick="decrementFocus()" onmousedown="animateButton(this)">◀</button>
                                    <button class="ptz-arrow-button" id="sliderFocusLabel" style="font-size: 17px;" onclick="selectFocus()">50</button>
                                    <button class="ptz-arrow-button" id="focusright" onclick="incrementFocus()" onmousedown="animateButton(this)">▶</button>
                                    <button class="arrow-button" id="focusoff" onclick="sendAutoFocusCommand(&#39;off&#39;)">off</button>
                                    <button class="ptz-arrow-button" id="focusminus" onclick="sendpadFocus(&#39;minus&#39;)" onmousedown="animateButton(this)">-</button>
                                    <button class="arrow-button" id="focuson" onclick="sendAutoFocusCommand(&#39;on&#39;)">on</button>
                            </div>

                            <div class="direction-pad hidden">
                                <button class="arrow-button" onclick="sendDirectionCommand(&#39;upleft&#39;)" onmousedown="animateButton(this)">↖</button>
                                <button class="arrow-button" onclick="sendDirectionCommand(&#39;up&#39;)" onmousedown="animateButton(this)">▲</button>
                                <button class="arrow-button" onclick="sendDirectionCommand(&#39;upright&#39;)" onmousedown="animateButton(this)">↗</button>
                                <button class="arrow-button" onclick="sendDirectionCommand(&#39;left&#39;)" onmousedown="animateButton(this)">◀</button>
                                <button class="arrow-button" onclick="sendDirectionCommand(&#39;stop&#39;)" onmousedown="animateButton(this)"></button>
                                <button class="arrow-button" onclick="sendDirectionCommand(&#39;right&#39;)" onmousedown="animateButton(this)">▶</button>
                                <button class="arrow-button" onclick="sendDirectionCommand(&#39;downleft&#39;)" onmousedown="animateButton(this)">↙</button>
                                <button class="arrow-button" onclick="sendDirectionCommand(&#39;down&#39;)" onmousedown="animateButton(this)">▼</button>
                                <button class="arrow-button" onclick="sendDirectionCommand(&#39;downright&#39;)" onmousedown="animateButton(this)">↘</button>
                            </div>


                            </div>

                    </div>
                </div>

                <!-- Twitch Chat -->


<div class="direction-container" id="twitchChatContainer">
    <h2 class="direction-heading" style="cursor: pointer;" onclick="toggleDirectionPad(&#39;.twitch-chat-container&#39;)">- Twitch Chat -</h2>
    <div class="twitch-chat-container">
        <div class="twitch-chat-wrapper" id="twitchChatMessages"></div>
    </div>
    <div class="resize-handle" data-target="twitchChat"></div>
</div>
                <!-- Swap buttons -->
                <div class="direction-container" id="swapContainer">
                    <h2 class="direction-heading" style="position: relative; text-align: center;">
                        <span style="display: inline-block; cursor: pointer;" onclick="toggleDirectionPad(&#39;.swap-container&#39;)">- Swap -</span>
                        <span class="info-icon" style="position: absolute; right: 10px; cursor: pointer;" onclick="startSwapIntro()">
                            <i class="fas fa-info-circle"></i> <!-- Font Awesome icon -->
                        </span>
                    </h2>
                    <div class="swap-container">
                        <div class="swap-buttons">
                            <button class="swap-num-button" onclick="setSwapNumber(2)">2</button>
                            <button class="swap-num-button" onclick="setSwapNumber(3)">3</button>
                            <button class="swap-num-button" onclick="setSwapNumber(4)">4</button>
                            <button class="swap-num-button" onclick="setSwapNumber(5)">5</button>
                            <button class="swap-num-button" onclick="setSwapNumber(6)">6</button>
                        </div>
                        <div class="swap-preset-buttons">
                            <button class="swap-preset-button" onclick="setPresetSwap(&#39;fox&#39;)">fox</button>
                            <button class="swap-preset-button" onclick="setPresetSwap(&#39;crow&#39;)">crow</button>
                            <button class="swap-preset-button" onclick="setPresetSwap(&#39;marm&#39;)">marm</button>
                            <button class="swap-preset-button" onclick="setPresetSwap(&#39;wolf&#39;)">wolf</button>
                            <button class="swap-preset-button" onclick="setPresetSwap(&#39;wolfin&#39;)">wolfin</button>
                            <button class="swap-preset-button" onclick="setPresetSwap(&#39;wden&#39;)">wden</button>
                        </div>
                        <div class="swap-two-preset-buttons">
		            <button class="swap-wide-preset-button" onclick="setPresetSwap(&#39;winws&#39;)">win-ws</button>
                            <button class="swap-wide-preset-button" onclick="setPresetSwap(&#39;wws&#39;)">wolf-ws</button>
                        </div>

                    </div>
                </div>

		  <!-- Spin buttons -->
                <div class="direction-container" id="spinContainer">
		    <h2 class="direction-heading" style="position: relative; text-align: center;">
                        <span style="display: inline-block; cursor: pointer;" onclick="toggleDirectionPad(&#39;.spin-container&#39;)">- Spin -</span>
                        <span class="info-icon" style="position: absolute; right: 10px; cursor: pointer;" onclick="startSpinIntro()">
                            <i class="fas fa-info-circle"></i> <!-- Font Awesome icon -->
                        </span>
                    </h2>

                    <div class="spin-container">
                        <!-- Pan Buttons -->
                        <h3>Pan</h3>
                        <div class="spin-buttons" id="pan-buttons">
                            <button class="spin-pan-button" onclick="setPanSpeed(5, this)">5</button>
                            <button class="spin-pan-button" onclick="setPanSpeed(10, this)">10</button>
                            <button class="spin-pan-button" onclick="setPanSpeed(20, this)">20</button>
                            <button class="spin-pan-button" onclick="setPanSpeed(40, this)">40</button>
                            <button class="spin-pan-button" onclick="setPanSpeed(70, this)">70</button>
                        </div>

                        <!-- Tilt Buttons -->
                        <h3>Tilt</h3>
                        <div class="spin-buttons" id="tilt-buttons">
                            <button class="spin-tilt-button" onclick="setTiltSpeed(5, this)">5</button>
                            <button class="spin-tilt-button" onclick="setTiltSpeed(10, this)">10</button>
                            <button class="spin-tilt-button" onclick="setTiltSpeed(20, this)">20</button>
                            <button class="spin-tilt-button" onclick="setTiltSpeed(40, this)">40</button>
                            <button class="spin-tilt-button" onclick="setTiltSpeed(70, this)">70</button>
                        </div>

                        <!-- Zoom Buttons -->
                        <h3>Zoom</h3>
                        <div class="spin-buttons" id="zoom-buttons">
                            <button class="spin-zoom-button" onclick="setZoomSpeed(5, this)">5</button>
                            <button class="spin-zoom-button" onclick="setZoomSpeed(20, this)">20</button>
                            <button class="spin-zoom-button" onclick="setZoomSpeed(40, this)">40</button>
                            <button class="spin-zoom-button" onclick="setZoomSpeed(70, this)">70</button>
                            <button class="spin-zoom-button" onclick="setZoomSpeed(100, this)">100</button>
                        </div>

                        <!-- Focus Buttons -->
                        <h3>Focus</h3>
                        <div class="spin-buttons" id="focus-buttons">
                            <button class="spin-focus-button" onclick="setFocusSpeed(1, this)">1</button>
                            <button class="spin-focus-button" onclick="setFocusSpeed(2, this)">2</button>
                            <button class="spin-focus-button" onclick="setFocusSpeed(5, this)">5</button>
                            <button class="spin-focus-button" onclick="setFocusSpeed(10, this)">10</button>
                            <button class="spin-focus-button" onclick="setFocusSpeed(50, this)">50</button>
                        </div>
	 	             <button class="mpv-button" id="enablespin" onclick="enableSpin(this)" style="display: block;">Enable Spin</button>
                    </div>
                </div>



                <!-- Zoom input buttons -->
                <div class="direction-container" id="zoomContainer">
                    <h2 class="direction-heading" style="cursor: pointer;" onclick="toggleDirectionPad(&#39;.zoom-container&#39;)">- Zoom - </h2>
                    <div class="zoom-container">
                        <div class="zoom-slider-wrapper">
 		          <select id="zoomSlider" class="dropdown">
  	                    <option value="0">0</option>
  	                    <option value="10">10</option>
  	                    <option value="20">20</option>
  	                    <option value="40">40</option>
  	                    <option value="50">50</option>
  	                    <option value="60">60</option>
  	                    <option value="70">70</option>
  	                    <option value="80">80</option>
  	                    <option value="90">90</option>
  	                    <option value="150">150</option>
  	                    <option value="200">200</option>
  	                    <option value="300">300</option>
  	                    <option value="400">400</option>
  	                    <option value="600">600</option>
			  </select>
                            <input type="text" id="zoomInput" class="zoominput" placeholder="Zoom" min="1" max="100">
                        </div>
                        <div class="ptz-input-wrapper">
                        </div>
                        <button class="send-button" onclick="sendZoom()" onmousedown="animateButton(this)">Send</button>
                    </div>
                </div>

                <!-- PTZ input buttons -->
                <div class="direction-container" id="ptz-Container">
                    <h2 class="direction-heading" style="cursor: pointer;" onclick="toggleDirectionPad(&#39;.ptz-container&#39;)">- PTZ -</h2>
                    <div class="ptz-container">
                        <div class="ptz-input-wrapper">
                            <input type="text" id="panInput" class="ptz-input" placeholder="Pan">
                            <input type="text" id="tiltInput" class="ptz-input" placeholder="Tilt">
                            <input type="text" id="zoomPTZInput" class="ptz-input" placeholder="Zoom">
                        </div>
                        <button class="send-button" onclick="sendPanTiltZoom()" onmousedown="animateButton(this)">Send</button>
                    </div>
                </div>

                <!-- Focus buttons -->
                <div class="direction-container" id="focusContainer">
                    <h2 class="direction-heading" style="cursor: pointer;" onclick="toggleDirectionPad(&#39;.focus-container&#39;)">- Focus -</h2>
                    <div class="focus-container">
                        <div class="focus-wrapper">
                            <input type="text" id="focus" class="focus-input" placeholder="Focus">
                            <button class="autofocus-button" onclick="sendAutoFocusCommand()"></button>
                        </div>
                        <button class="focus-button" onclick="sendFocusCommand()" onmousedown="animateButton(this)">Focus</button>
                    </div>

                </div>


                <!-- IR buttons -->
                <div class="direction-container" id="irContainer">
                    <h2 class="direction-heading" style="cursor: pointer;" onclick="toggleDirectionPad(&#39;.ir-container&#39;)">- IR -</h2>
                    <div class="ir-container">
                        <div class="ir-wrapper">
                            <button class="ir-auto-button" onclick="sendIRcommand(&#39;auto&#39;)">Auto</button>
                            <button class="ir-on-button" onclick="sendIRcommand(&#39;on&#39;)">On</button>
                            <button class="ir-off-button" onclick="sendIRcommand(&#39;off&#39;)">Off</button>
                        </div>
                    </div>
                </div>

                <!-- Other buttons -->
                <div class="direction-container" id="otherContainer">
		    <h2 class="direction-heading" style="position: relative; text-align: center;">
                        <span style="display: inline-block; cursor: pointer;" onclick="toggleDirectionPad(&#39;.other-container&#39;)">- Other -</span>
                        <span class="info-icon" style="position: absolute; right: 10px; cursor: pointer;" onclick="void(0)">
                            <i class="fas fa-info-circle"></i> <!-- Font Awesome icon -->
                        </span>
                    </h2>

                    <div class="other-container">
                        <div class="other-wrapper">
                            <button class="volume-button" onclick="sendVolumeControl()"></button>
                            <button class="reset-button" onclick="sendReset()"></button>
                            <button class="spincircle-button" id="enablecriclespin" onclick="enableSpinCircle(this)" style="display: none;"></button> 
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-side">

        <div id="video-placeholder"></div>
        <!-- Preset Container -->
<div class="preset-container grid-layout grid-large" id="presetContainer" style="">
    <div class="preset-container-card">
        <div class="preset-header">
            <div class="vidbuttondiv" style="display: none;">
                <button class="vidbuttons" onclick="toggleVideo(&#39;video&#39;)">Video</button>
                <button class="vidbuttons" id="openDialogButton">Presets</button>
            </div>
            <div class="label-with-icons">
            <h2 class="label-preset-heading" style="cursor: pointer;" onclick="toggleDirectionPad(&#39;.preset-pad&#39;)">- Presets -</h2>
                <span class="preset-layout-icons">
                    <span id="listIcon" class="list-icon"></span>
                    <span id="presetGridIcon" class="grid-icon active-icon"></span>
                </span>
            </div>
            <div class="preset-header-right">
                <div class="sort-icon-wrapper">
                    <span class="sort-icon"><img src="/img/sort-icon.png" alt="Sort" draggable="false"></span>
                    <div class="sort-menu">
                        <div class="sort-menu-inner">
                            <div class="sort-menu-label">Sort</div>
                            <div class="sort-menu-item sort-orig-item active">Default</div>
                            <div class="sort-menu-item sort-az-item">A → Z</div>
                            <div class="sort-menu-divider"></div>
                            <div class="sort-menu-label">Grid size</div>
                            <div class="sort-menu-item sort-grid-small-item">Small</div>
                            <div class="sort-menu-item sort-grid-large-item active">Large</div>
                        </div>
                    </div>
                </div>
                <input type="text" id="presetSearch" placeholder="Search..">
            </div>
        </div>
        <div class="preset-pad two-columns" id="presetPad"></div>

        <div class="custom-preset-container">
            <h2 class="custom-label-preset">- Custom Presets -</h2>
            <div class="custom-preset-pad" id="customPresetPad"></div>
        </div>
    </div>
</div>

        </div>
    </div>

    <!-- Compatibility stubs for script.js (legacy ids, never shown) -->
    <div class="hidden-stub">
        <button id="sliderValueLabel">1</button>
        <select id="swap-dropdown1"><option value="option1">-Select-</option></select>
        <select id="swap-dropdown2"><option value="option1">-Select-</option></select>
        <input id="swap1"><input id="swap2">
        <select id="zoom-dropdown"><option value="option1">-Select-</option></select>
        <input id="zoomRInput">
        <input id="speedSlider">
    </div>
    <form id="commandForm" action="/send-command" method="post"><input type="hidden" id="commandInput" name="command"></form>
    <script src="vendor/panzoom.min.js"></script>
    <script src="vendor/hls.min.js"></script>
    <script src="vendor/fabric.min.js"></script>
    <script src="vendor/intro.min.js"></script>
    <script>function openAdminPage(){window.location.href="admin.html";}</script>
    <script src="script.js?v=5"></script>
    <script src="web-features.js?v=5"></script>
    <script src="click-preset.js?v=6"></script>
    <script src="slots-pano.js?v=16"></script>
    <script src="preset-shot.js?v=1"></script>
</body>
</html>
